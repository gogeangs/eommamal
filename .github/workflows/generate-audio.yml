name: Generate recorded audio

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "sample = two files per language; full = all missing/changed"
        required: true
        default: sample
        type: choice
        options: [sample, full]
      languages:
        description: "all or comma-separated codes: ko,ru,mn,vi,uz,zh,en"
        required: true
        default: all
        type: string
      force:
        description: "Regenerate matching audio too"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audio-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show estimate without API calls
        env:
          SCOPE: ${{ inputs.scope }}
          LANGUAGES: ${{ inputs.languages }}
        run: node scripts/audio/generate.mjs --dry-run --scope="$SCOPE" --languages="$LANGUAGES"
      - name: Generate new and changed recordings
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SCOPE: ${{ inputs.scope }}
          LANGUAGES: ${{ inputs.languages }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--scope="$SCOPE" --languages="$LANGUAGES")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          node scripts/audio/generate.mjs "${args[@]}"
      - name: Open audio-only PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: audio/update-${{ github.run_id }}
          base: main
          delete-branch: true
          commit-message: "chore(audio): update generated multilingual recordings"
          title: "chore(audio): update recorded readings (${{ inputs.scope }})"
          body: |
            Automatically generated by Azure Speech using GitHub Secrets.
            Review Mongolian and Uzbek pronunciation before merging.
            Missing or changed text falls back to device TTS.
          add-paths: |
            public/audio/
