<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCE7A8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Playpen+Sans:wght@400;700&family=Shantell+Sans:wght@400;700&family=ZCOOL+KuaiLe&display=swap" />
    <title>엄마말 그림책</title>
  </head>
  <body>
    <!-- Launch splash: shown until the app has drawn, then faded out by main.tsx. Art source: resources/splash-source.png -->
    <style>
      #splash{position:fixed;inset:0;z-index:100;background:#F8EDE0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease}
      #splash.out{opacity:0;pointer-events:none}
      #splash img{display:block;width:100%;height:auto}
      #splash .art{position:relative;width:min(100vw,100vh)}
      #splash b{position:absolute;left:0;right:0;top:7%;text-align:center;font:400 clamp(2.2rem,9vw,4rem)/1.1 'Ownglyph PDH','Nunito',sans-serif;color:#1F2B3A;letter-spacing:-.02em}
      @media (orientation:landscape){#splash img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}}
      @media (orientation:portrait){#splash{justify-content:flex-end}#splash b{position:fixed;top:26vh;font-size:clamp(2.6rem,11vw,4.4rem)}}
      @media (prefers-reduced-motion:reduce){#splash{transition:none}}
    </style>
    <div id="splash" aria-hidden="true"><div class="art"><img src="./src/assets/splash.webp" alt="" /><b>엄마말 그림책</b></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
